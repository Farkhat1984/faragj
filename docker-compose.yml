services:
  app:
    build: .
    image: vibe-code-live:latest
    container_name: vibe-code-live
    restart: unless-stopped
    environment:
      PORT: "4000"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-vibe}"
    ports:
      - "127.0.0.1:4010:4000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
